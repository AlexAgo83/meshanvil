<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>meshanvil</title>
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><span class="mark"></span>meshanvil</div>
    <div class="menubar" aria-label="Main menu" data-i18n-aria-label="ui.main_menu">
      <details class="menu"><summary data-i18n="ui.menu_file">File</summary><div class="dropdown">
        <span data-i18n="ui.command_list">List operations</span><code>meshanvil list</code>
        <span data-i18n="ui.command_doctor">Check setup</span><code>meshanvil doctor</code>
      </div></details>
      <details class="menu"><summary data-i18n="ui.menu_chain">Chain</summary><div class="dropdown">
        <span data-i18n="ui.command_view">Refresh viewer</span><code>meshanvil view --serve</code>
        <span data-i18n="ui.command_prune">Preview pruning</span><code>meshanvil prune --dry-run</code>
      </div></details>
      <details class="menu"><summary data-i18n="ui.menu_help">Help</summary><div class="dropdown">
        <span data-i18n="ui.command_runbook">Create a runbook</span><code>meshanvil runbook &lt;report-id&gt;</code>
      </div></details>
    </div>
    <div class="tabs" role="tablist" aria-label="Workspace" data-i18n-aria-label="ui.workspace">
      <button type="button" role="tab" aria-selected="true" data-workspace="chain" data-i18n="ui.workspace_chain">Chain</button>
      <button type="button" role="tab" aria-selected="false" data-workspace="compare" data-i18n="ui.workspace_compare">Compare</button>
      <button type="button" role="tab" aria-selected="false" data-workspace="runbooks" data-i18n="ui.workspace_runbooks">Runbooks</button>
    </div>
    <button type="button" class="start-link" id="start-screen" data-i18n="ui.start">Start</button>
    <span class="spacer"></span>
    <div class="scene"><span>work/ops</span><b id="chain-name">—</b><span id="op-count"></span></div>
  </div>

  <div class="editors">
    <section class="editor" aria-label="Chain outliner" data-i18n-aria-label="ui.chain_outliner">
      <div class="ehead"><span class="icon">▤</span><span class="name" data-i18n="ui.outliner">Outliner</span><span class="push"></span>
        <input class="filterbox" id="outliner-filter" type="search" data-i18n-placeholder="ui.filter" placeholder="filter…" aria-label="Filter" data-i18n-aria-label="ui.filter"></div>
      <div class="outliner" id="outliner"></div>
    </section>

    <div class="colstack">
      <section class="editor" id="graph-editor" aria-label="Operation graph" data-i18n-aria-label="ui.operation_graph">
        <div class="ehead"><span class="icon">⬡</span><span class="name" data-i18n="ui.node_editor">Node Editor</span>
          <span style="color:var(--dimmer)">links.parent</span></div>
        <div class="nodewrap"><div class="canvas" id="canvas">
          <svg class="noodles" id="noodles" aria-hidden="true"></svg>
          <div id="nodes"></div>
        </div></div>
      </section>

      <section class="editor preview" aria-label="Render preview" data-i18n-aria-label="ui.render_preview">
        <div class="ehead"><span class="icon">▨</span><span class="name" data-i18n="ui.image_editor">Image Editor</span>
          <span id="pvtitle" style="color:var(--dimmer)"></span><span class="push"></span>
          <span class="pvviews" id="pvviews" role="tablist" aria-label="View" data-i18n-aria-label="ui.view"></span></div>
        <div class="pvbody">
          <div class="pvstage" id="pvstage"></div>
          <div class="pvmeta" id="pvmeta"></div>
        </div>
      </section>
    </div>

    <section class="editor" aria-label="Operation report" data-i18n-aria-label="ui.operation_report">
      <div class="ehead"><span class="icon">▣</span><span class="name" data-i18n="ui.properties">Properties</span>
        <span style="color:var(--dimmer)" data-i18n="ui.report">report</span><span class="push"></span>
        <span class="filter" id="schema"></span></div>
      <div class="props">
        <nav class="rail" aria-label="Report sections" data-i18n-aria-label="ui.report_sections">
          <button type="button" data-section-goto="input" aria-selected="true" title="Input" data-i18n-title="ui.input">I</button>
          <button type="button" data-section-goto="measurements" aria-selected="false" title="Measurements" data-i18n-title="ui.measurements">M</button>
          <button type="button" data-section-goto="links" aria-selected="false" title="Links" data-i18n-title="ui.links">L</button>
        </nav>
        <div class="propscroll" id="props"></div>
      </div>
    </section>
  </div>

  <div class="status">
    <span id="status-counts"></span><span class="push"></span>
    <span id="generated"></span>
  </div>
</div>
<script src="data.js"></script>
<script src="viewer.js"></script>
</body>
</html>
