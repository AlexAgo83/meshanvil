name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # git grep over the tracked tree
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make check
