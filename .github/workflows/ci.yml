name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # git grep over the tracked tree
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python -m pip install pytest   # the only test dependency; the tool itself has none
      - run: make check          # compile, types, selfcheck, hygiene
      - run: make install-check  # builds the wheel and runs the console script from a venv
      - run: make logics         # the corpus is part of the deliverable, so it is gated
